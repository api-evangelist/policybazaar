name: Policybazaar
description: 'Policybazaar is India''s largest online insurance aggregator and digital
  marketplace, operated by PB Fintech Ltd. It lets consumers compare, buy and manage
  insurance across health, term life, motor, travel, investment and corporate lines
  from a wide panel of insurers, providing quotes, policy issuance, renewals, claims
  assistance and advisory. Surfaced as a portfolio company of SoftBank Vision Fund
  and added to the API Evangelist network. As of this enrichment pass Policybazaar
  publishes a consumer-facing web and mobile marketplace but no public developer
  portal, API documentation, or machine-readable API surface (no developer/API
  subdomain, no /.well-known documents, no llms.txt).'
